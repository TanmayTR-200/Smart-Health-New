# Render Blueprint for Smart Health
# Uses SQLite (no separate database service needed)
# Go to: Dashboard → New → Blueprint → select your repo

services:
  - type: web
    name: smart-health-new-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python setup_database.py && cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false
      - key: API_ENV
        value: production
