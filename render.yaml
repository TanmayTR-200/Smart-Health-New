# Render Blueprint for Smart Health
# Uses PostgreSQL so data persists across auto-deploys
# Go to: Dashboard → New → Blueprint → select your repo

databases:
  - name: smart-health-new-db
    databaseName: smart_health_new
    plan: free
    ipAllowList: []

services:
  - type: web
    name: smart-health-new-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python setup_database.py && cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-health-new-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: API_ENV
        value: production
